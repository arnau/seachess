url = "https://spawn-queue.acm.org/doi/10.1145/3807966"
title = "From Technical Debt to Cognitive and Intent Debt"
summary = "An article arguing two forms of debt are increasingly more present: Cognitive debt, the erosion of shared understanding across a team where no one can confidently explain how a system works or predict the impact of a change and intent debt, the absence of clear goals, constraints, and rationale that explain what the system is for and guide how it should evolve."
