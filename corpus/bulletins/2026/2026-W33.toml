title = "scheck"
summary = "A tool to validate JSON using assertion-based rules leveraging JSONPath expressions. Think Schematron without XML."
content_type = "text"

[[entries]]
url = "https://celld.dev/"
title = "celld"
summary = "A self-hosted, distributed Durable Objects compatible implementation. It is a stateful distributed system that runs server-side JavaScript using the same API as Cloudflare Workers and Durable Objects. It organizes applications into cells—small, named servers each with a private SQLite database—that serve HTTP, hold WebSocket connections, set alarms, and make outbound connections, with single-threaded execution ensuring data consistency without locks."
content_type = "text"
