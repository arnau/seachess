title = "anydoc"
summary = "A Rust library to transform Word, PowerPoint, Excel, OpenDocument, RTF, EPUB, CSV, and PDF into GitHub-Flavored Markdown. Includes bindings for Node.js, Python, and the browser (WebAssembly)."
content_type = "text"

[[entries]]
