[[entries]]
url = "https://fion.ac/jellyfish.pdf"
title = "Artificial Intelligence in the Firm: Bottlenecks in Software Production"
summary = "A paper on the findings on how AI coding assistants and agents affect software engineering work, firm output, and employment. Data used for the analysis spans between 2021 and 2026. The study finds that while AI tools substantially increase coding productivity—with AI agents but these gains do not translate into proportional increases in firm-level software output or employment reductions."
content_type = "text"

